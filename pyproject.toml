[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steginsight"
version = "2.0.0"
description = "Steganalysis and carrier-integrity workbench for digital forensics practitioners."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Farman Khan", email = "farmankhan001@gmail.com" }]
keywords = ["steganography", "steganalysis", "forensics", "dfir", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Utilities",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pillow>=10.0",
]

[project.optional-dependencies]
dct = ["jpeglib>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
steginsight = "steginsight.cli.main:main"

[project.urls]
Homepage = "https://github.com/Red-Snow/StegInsight-Forensics"
Issues = "https://github.com/Red-Snow/StegInsight-Forensics/issues"

[tool.hatch.build.targets.wheel]
packages = ["steginsight"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter, not the linter
  # This project's whole purpose includes detecting visually-confusable
  # characters, so its source necessarily contains them: Cyrillic homoglyphs in
  # the detector's own docstrings and tests, and mathematical minus signs in the
  # RS-analysis derivation. Flagging them here is noise.
  "RUF001", "RUF002", "RUF003",
  "N818",   # `UnsupportedJpeg` reads better than `UnsupportedJpegError`
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
